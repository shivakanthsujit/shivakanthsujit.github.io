- title: Research Highlights
  type: time_table
  contents:
    - title: Offline RL post-training for flow-matching VLAs
      year: 2026
      description:
        - Applied the vanilla critic-gradient actor objective to a billion-scale flow-matching VLA with behavior-cloning regularization.
        - Improved task success from a 4% behavior-cloning floor to 94% on a task-agnostic play-data benchmark; changing only critic observability produced an approximately 2x gain.
        - Built chunked FQL, Cal-QL critics, exact 10-step BPTT with gradient checkpointing, and 24-arm sweeps across 8 GPUs.
    - title: Reducible Loss prioritization
      year: 2022 - 2023
      description:
        - Developed ReLo, a prioritization method that improved performance by 20% over prioritized experience replay with negligible overhead; published at NeurIPS 2023.
    - title: Variational Sparse Gating
      year: 2021 - 2022
      description:
        - Improved model-based RL sample efficiency with 2x fewer gradient steps; published at NeurIPS 2022.

