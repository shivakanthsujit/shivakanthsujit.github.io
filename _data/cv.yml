      - label: Focus
        details: Embodied AI, VLA/VLM post-training, reinforcement learning, and high-performance robotics deployment systems.

    Experience:
      - company: ARAYA Inc.
        position: Deep RL Researcher
        location: Tokyo, Japan
        start_date: 2024
        end_date: present
        highlights:
          - Building post-training and deployment frameworks for vision-language-action models used in assistive human-robot interaction.
          - Demonstrated that a standard offline actor-critic objective can post-train a billion-scale flow-matching VLA without flow-specific actor objectives, distillation, or test-time guidance.
          - Built batched inference and KV-cache support for a robotics foundation model, reducing a key rollout path from about 20 seconds to 0.2 seconds and enabling online RL.
          - Optimized data, training, and inference pipelines by about 2x, enabling same-day data collection-to-deployment cycles.
          - Built automated annotation pipelines that transform demonstrations and instructions into dense subtask and motion-primitive supervision.

      - company: Microsoft Research
        position: Research Intern
        location: New York, USA
        start_date: 2023
        end_date: 2023
        highlights:
          - Developed a reachability-aware latent representation using multi-step inverse dynamics for sample-efficient reinforcement learning.
          - Enabled hierarchical planning with 3x faster goal reaching and 50% fewer operations, including zero-sample ad hoc goal reaching in reward-free environments.

    Education:
      - institution: Mila / École de technologie supérieure
        location: Montreal, Canada
        area: Computer Science
        studyType: Research MSc
        start_date: 2021
        end_date: 2023
        highlights:
          - "GPA: 4.15/4.30"
          - "Thesis: [Evaluation of sample efficiency in offline reinforcement learning](https://espace.etsmtl.ca/id/eprint/3424/)"
          - "Supervisor: Prof. Samira Ebrahimi Kahou"

      - institution: National Institute of Technology Tiruchirappalli
        area: Instrumentation and Control Engineering
        studyType: BTech
        start_date: 2017
        end_date: 2021

    Research Highlights:
      - label: Offline RL post-training for flow-matching VLAs (2026)
        details: Applied the vanilla critic-gradient actor objective to a billion-scale flow-matching VLA with behavior-cloning regularization; improved task success from a 4% behavior-cloning floor to 94% on a task-agnostic play-data benchmark; built chunked FQL, Cal-QL critics, exact 10-step BPTT with gradient checkpointing, and 24-arm sweeps across 8 GPUs.
      - label: Reducible Loss prioritization (2022–2023)
        details: Developed ReLo, a prioritization method that improved performance by 20% over prioritized experience replay with negligible overhead; published at NeurIPS 2023.
      - label: Variational Sparse Gating (2021–2022)
        details: Improved model-based RL sample efficiency with 2x fewer gradient steps; published at NeurIPS 2022.

    Technical Strengths:
      - label: Embodied AI and reinforcement learning
        details: Offline and online RL; actor-critic methods; VLA/VLM post-training; behavior cloning; rollout evaluation; real-robot integration; assistive robotics; shared autonomy; and human-robot interaction.
      - label: Performance engineering
        details: Profiling-driven GPU optimization, batching, KV-cache management, vectorization, kernel tuning, compilation, and end-to-end optimization across data collection, training, inference, and deployment.
      - label: Research systems
        details: Reproducible experiment pipelines, large-scale sweeps, diagnostics, automated annotation, and deployment tooling.

    Publications:
      - title: Research output
        authors:
          - Shivakanth Sujit
        publisher: Publications and thesis
        summary: Twelve papers and preprints, plus a master's thesis, spanning reinforcement learning, robotics, human-robot interaction, computer vision, and scientific machine learning. See the complete [publication list](/publications/) or [Google Scholar](https://scholar.google.com/citations?hl=en&user=oXpK8V8AAAAJ).
